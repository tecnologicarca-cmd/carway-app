<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>CarWay atualizado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(
          circle at top,
          #1e3a5f 0%,
          #0f172a 48%,
          #020617 100%
        );
    }

    .painel {
      width: 100%;
      max-width: 620px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.42);
    }

    .icone {
      width: 78px;
      height: 78px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      color: #ffffff;
      background: linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
      );
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.1;
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      margin-top: 30px;
      padding: 0 28px;
      border-radius: 14px;
      color: #ffffff;
      background: #2563eb;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    .botao:hover {
      transform: translateY(-2px);
      background: #1d4ed8;
    }

    .aviso {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="painel">
    <div class="icone">C</div>

    <h1>O CarWay foi atualizado</h1>

    <p>
      Esta versão antiga foi pausada.
      Para continuar utilizando o CarWay,
      acesse a nova plataforma pelo botão abaixo.
    </p>

    https://carway.sistemalan.online/
      Acessar o novo CarWay
    </a>

    <div class="aviso">
      Caso tenha instalado a versão anterior,
      abra o novo endereço e instale novamente o aplicativo.
    </div>
  </main>
</body>
</html>
